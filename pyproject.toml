[project]
name = "ouro-agent"
version = "0.3.3"
description = "Local-first personal agent runtime."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28",
    "httpx-sse>=0.4.3",
    "jsonschema>=4.25",
    "mcp>=1.28,<2",
    "packaging>=24.2",
    "pathspec>=1.1.1",
    "pillow>=12.3,<13",
    "pydantic>=2.13",
    "pyperclip>=1.11,<2",
    "pyyaml>=6.0.2",
    "referencing>=0.36",
    "rich>=15,<16",
    "textual>=8.2,<9",
    "tzdata>=2025.2",
    "tzlocal>=5.4.4",
    "unicode-segmentation-rs>=0.3.3,<0.4",
    "wcmatch>=11.0",
]

[project.optional-dependencies]
themes = ["arrayfunc>=8.5.7,<9"]

[project.urls]
Homepage = "https://github.com/djsaber/OURO"
Documentation = "https://github.com/djsaber/OURO/blob/main/docs/README.md"
Repository = "https://github.com/djsaber/OURO"
Issues = "https://github.com/djsaber/OURO/issues"
Changelog = "https://github.com/djsaber/OURO/blob/main/CHANGELOG.md"

[project.scripts]
ouro = "ouro.cli.main:main"
ouro-upgrade = "ouro_upgrade.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.1",
    "pytest>=9",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7",
    "ruff>=0.15",
    "types-jsonschema>=4.26",
    "types-pyperclip>=1.11.0.20260508",
    "types-pyyaml>=6.0.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["ouro"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ouro", "ouro_upgrade"]

[project]
name = "ouro-agent"
version = "0.1.0"
description = "Local-first personal agent runtime."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28",
    "httpx-sse>=0.4.3",
    "jsonschema>=4.25",
    "mcp>=1.28,<2",
    "numpy>=2.4,<3",
    "pathspec>=1.1.1",
    "pydantic>=2.13",
    "pyperclip>=1.11,<2",
    "pyyaml>=6.0.2",
    "rich>=15,<16",
    "textual>=8.2,<9",
    "tzdata>=2025.2",
    "tzlocal>=5.4.4",
    "wcmatch>=11.0",
]

[project.scripts]
ouro = "ouro.cli.main:main"

[dependency-groups]
dev = [
    "mypy>=2.1",
    "pytest>=9",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7",
    "ruff>=0.15",
    "types-jsonschema>=4.26",
    "types-pyperclip>=1.11.0.20260508",
    "types-pyyaml>=6.0.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["ouro"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ouro"]

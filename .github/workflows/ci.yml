name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-unit:
    name: Architecture / core unit gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen --all-groups

      - name: Check architecture and core units
        run: uv run --frozen pytest -q tests/architecture tests/core

  quality:
    name: Python 3.12 / ${{ matrix.os }}
    needs: architecture-unit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen --all-groups

      - name: Run tests
        run: uv run --frozen pytest

      - name: Check lint
        run: uv run --frozen ruff check ouro tests

      - name: Check formatting
        run: uv run --frozen ruff format --check ouro tests

      - name: Check types
        run: uv run --frozen mypy ouro

      - name: Compile package
        run: uv run --frozen python -m compileall -q ouro

      - name: Build distributions
        run: uv build

      - name: Enforce coverage floor
        if: runner.os == 'Linux'
        run: uv run --frozen pytest --cov=ouro --cov-report=term-missing

[project]
name = "ouro-tui-themes"
version = "0.4.1"
description = "Optional OURO welcome theme packages and shared rendering tools."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "ouro-agent>=0.4.7",
    "numpy>=2.3.3,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ouro_tui_themes"]
